name: Verify random-switching transience proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/switching-transience/**', '.github/workflows/switching-transience.yml']
  pull_request:
    paths: ['projects/switching-transience/**', '.github/workflows/switching-transience.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/switching-transience/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/switching-transience
          python -B projects/switching-transience/verify.py verify > "$RUNNER_TEMP/switching-normal.json"
          python -B -O projects/switching-transience/verify.py verify > "$RUNNER_TEMP/switching-optimized.json"
          cmp "$RUNNER_TEMP/switching-normal.json" "$RUNNER_TEMP/switching-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
