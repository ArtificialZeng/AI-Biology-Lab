name: Open biology exact checks

on:
  push:
    branches: [main]
    paths:
      - projects/directed-cycle-identifiability/**
      - projects/dual-futile-symmetry/**
      - .github/workflows/open-biology.yml
      - scripts/verify_open_biology.py
  pull_request:
    paths:
      - projects/directed-cycle-identifiability/**
      - projects/dual-futile-symmetry/**
      - .github/workflows/open-biology.yml
      - scripts/verify_open_biology.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: Exact biology (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r projects/directed-cycle-identifiability/requirements.txt
      - run: python scripts/verify_open_biology.py
