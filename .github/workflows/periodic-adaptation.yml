name: Verify periodic adaptation mean identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/periodic-adaptation/**', '.github/workflows/periodic-adaptation.yml']
  pull_request:
    paths: ['projects/periodic-adaptation/**', '.github/workflows/periodic-adaptation.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/periodic-adaptation/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/periodic-adaptation
          python -B projects/periodic-adaptation/verify.py verify > "$RUNNER_TEMP/periodic-normal.json"
          python -B -O projects/periodic-adaptation/verify.py verify > "$RUNNER_TEMP/periodic-optimized.json"
          cmp "$RUNNER_TEMP/periodic-normal.json" "$RUNNER_TEMP/periodic-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
