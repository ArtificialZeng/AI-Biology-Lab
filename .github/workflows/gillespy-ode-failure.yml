name: GillesPy ODE failure propagation audit
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/gillespy-ode-failure/**'
      - '.github/workflows/gillespy-ode-failure.yml'
  push:
    branches: [main]
    paths:
      - 'projects/gillespy-ode-failure/**'
      - '.github/workflows/gillespy-ode-failure.yml'
jobs:
  exact-audit:
    timeout-minutes: 15
    name: '${{ matrix.os }} / Python ${{ matrix.python }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/gillespy-ode-failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Replay actual baseline and candidate normally and under optimization
        shell: bash
        run: |
          set -eu
          python -B verify.py verify > "$RUNNER_TEMP/gillespy-ode-normal.json"
          python -O -B verify.py verify > "$RUNNER_TEMP/gillespy-ode-optimized.json"
          cmp "$RUNNER_TEMP/gillespy-ode-normal.json" "$RUNNER_TEMP/gillespy-ode-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
