name: Verify multi-pathogen coexistence correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/multipathogen-coexistence/**', '.github/workflows/multipathogen-coexistence.yml']
  pull_request:
    paths: ['projects/multipathogen-coexistence/**', '.github/workflows/multipathogen-coexistence.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/multipathogen-coexistence/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/multipathogen-coexistence
          python -B projects/multipathogen-coexistence/verify.py verify > "$RUNNER_TEMP/coexistence-normal.json"
          python -B -O projects/multipathogen-coexistence/verify.py verify > "$RUNNER_TEMP/coexistence-optimized.json"
          cmp "$RUNNER_TEMP/coexistence-normal.json" "$RUNNER_TEMP/coexistence-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
