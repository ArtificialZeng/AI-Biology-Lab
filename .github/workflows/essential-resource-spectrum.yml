name: Essential-resource spectrum counterexample

on:
  pull_request:
    paths:
      - 'projects/essential-resource-spectrum-counterexample/**'
      - '.github/workflows/essential-resource-spectrum.yml'
  push:
    branches: [main]
    paths:
      - 'projects/essential-resource-spectrum-counterexample/**'
      - '.github/workflows/essential-resource-spectrum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Native exact resource checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/essential-resource-spectrum-counterexample/requirements.txt
      - run: python -m pip install -r projects/essential-resource-spectrum-counterexample/requirements.txt
      - run: python projects/essential-resource-spectrum-counterexample/verify.py
      - run: python -O projects/essential-resource-spectrum-counterexample/verify.py
