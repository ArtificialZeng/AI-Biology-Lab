name: Verify two-graph Moran fixation bounds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/two-graph-moran-matching/**', '.github/workflows/two-graph-moran-matching.yml']
  pull_request:
    paths: ['projects/two-graph-moran-matching/**', '.github/workflows/two-graph-moran-matching.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/two-graph-moran-matching/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/two-graph-moran-matching
          python -B projects/two-graph-moran-matching/verify.py verify > "$RUNNER_TEMP/matching-normal.json"
          python -B -O projects/two-graph-moran-matching/verify.py verify > "$RUNNER_TEMP/matching-optimized.json"
          cmp "$RUNNER_TEMP/matching-normal.json" "$RUNNER_TEMP/matching-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
