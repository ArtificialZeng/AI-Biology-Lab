name: Adjacent catenary exact audit
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/adjacent-catenary-auditor/**'
      - '.github/workflows/adjacent-catenary-audit.yml'
  push:
    branches: [main]
    paths:
      - 'projects/adjacent-catenary-auditor/**'
      - '.github/workflows/adjacent-catenary-audit.yml'
jobs:
  exact-audit:
    timeout-minutes: 15
    name: '${{ matrix.os }} / Python ${{ matrix.python }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/adjacent-catenary-auditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Compare read-only normal and optimized checks
        shell: bash
        run: |
          set -eu
          python -B verify.py verify > "$RUNNER_TEMP/catenary-primary.json"
          python -O -B verify.py verify > "$RUNNER_TEMP/catenary-primary-O.json"
          cmp "$RUNNER_TEMP/catenary-primary.json" "$RUNNER_TEMP/catenary-primary-O.json"
          python -B verify_independent.py verify > "$RUNNER_TEMP/catenary-independent.json"
          python -O -B verify_independent.py verify > "$RUNNER_TEMP/catenary-independent-O.json"
          cmp "$RUNNER_TEMP/catenary-independent.json" "$RUNNER_TEMP/catenary-independent-O.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
