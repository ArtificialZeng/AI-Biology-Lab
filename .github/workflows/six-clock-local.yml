name: Six-species local clock certificate

on:
  push:
    branches: [main]
    paths:
      - 'projects/six-clock-local-damping/**'
      - '.github/workflows/six-clock-local.yml'
  pull_request:
    paths:
      - 'projects/six-clock-local-damping/**'
      - '.github/workflows/six-clock-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: Exact local clock checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/six-clock-local-damping/requirements.txt
      - run: python -m pip install -r projects/six-clock-local-damping/requirements.txt
      - run: python projects/six-clock-local-damping/verify.py verify
      - run: python -O projects/six-clock-local-damping/verify.py verify
