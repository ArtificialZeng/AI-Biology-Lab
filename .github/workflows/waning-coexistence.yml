name: Full-waning coexistence exact checks

on:
  push:
    branches: [main]
    paths:
      - 'projects/waning-coexistence-auditor/**'
      - '.github/workflows/waning-coexistence.yml'
  pull_request:
    paths:
      - 'projects/waning-coexistence-auditor/**'
      - '.github/workflows/waning-coexistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: '${{ matrix.os }} / Python ${{ matrix.python }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: projects/waning-coexistence-auditor/requirements.txt
      - run: python -m pip install -r projects/waning-coexistence-auditor/requirements.txt
      - name: Compare normal and optimized exact checks
        shell: bash
        run: |
          set -eu
          python projects/waning-coexistence-auditor/verify.py verify > "$RUNNER_TEMP/waning-original.json"
          python -O projects/waning-coexistence-auditor/verify.py verify > "$RUNNER_TEMP/waning-original-O.json"
          cmp "$RUNNER_TEMP/waning-original.json" "$RUNNER_TEMP/waning-original-O.json"
          python projects/waning-coexistence-auditor/verify_independent.py verify > "$RUNNER_TEMP/waning-independent.json"
          python -O projects/waning-coexistence-auditor/verify_independent.py verify > "$RUNNER_TEMP/waning-independent-O.json"
          cmp "$RUNNER_TEMP/waning-independent.json" "$RUNNER_TEMP/waning-independent-O.json"
          python projects/waning-coexistence-auditor/root-count/check.py verify > "$RUNNER_TEMP/waning-roots.json"
          python -O projects/waning-coexistence-auditor/root-count/check.py verify > "$RUNNER_TEMP/waning-roots-O.json"
          cmp "$RUNNER_TEMP/waning-roots.json" "$RUNNER_TEMP/waning-roots-O.json"
          python projects/waning-coexistence-auditor/root-count/check_heldout.py verify > "$RUNNER_TEMP/waning-roots-heldout.json"
          python -O projects/waning-coexistence-auditor/root-count/check_heldout.py verify > "$RUNNER_TEMP/waning-roots-heldout-O.json"
          cmp "$RUNNER_TEMP/waning-roots-heldout.json" "$RUNNER_TEMP/waning-roots-heldout-O.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
