name: Compartment beta-gap finite exact checks

on:
  push:
    branches: [main]
    paths:
      - 'projects/compartment-beta-gap/**'
      - '.github/workflows/compartment-beta-gap.yml'
  pull_request:
    paths:
      - 'projects/compartment-beta-gap/**'
      - '.github/workflows/compartment-beta-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/compartment-beta-gap/requirements.txt
      - run: python -m pip install -r projects/compartment-beta-gap/requirements.txt
      - name: Compare normal and optimized read-only verification
        shell: bash
        run: |
          set -euo pipefail
          python -B projects/compartment-beta-gap/verify.py verify > "$RUNNER_TEMP/beta-normal.json"
          python -B -O projects/compartment-beta-gap/verify.py verify > "$RUNNER_TEMP/beta-optimized.json"
          diff -u "$RUNNER_TEMP/beta-normal.json" "$RUNNER_TEMP/beta-optimized.json"
      - name: Check explicit external regeneration and unchanged archive
        shell: bash
        run: |
          set -euo pipefail
          python -B projects/compartment-beta-gap/verify.py regenerate --output "$RUNNER_TEMP/beta-regenerated.json"
          diff -u projects/compartment-beta-gap/evidence/certificate.json "$RUNNER_TEMP/beta-regenerated.json"
          if python -B projects/compartment-beta-gap/verify.py regenerate --output "$RUNNER_TEMP/beta-regenerated.json"; then
            exit 1
          fi
          git diff --exit-code -- projects/compartment-beta-gap
          test -z "$(git status --porcelain --untracked-files=all -- projects/compartment-beta-gap)"
