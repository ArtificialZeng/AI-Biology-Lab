name: Compartment beta-gap finite exact checks

on:
  push:
    branches: [main]
    paths:
      - 'projects/compartment-beta-gap/**'
      - '.github/workflows/compartment-beta-gap.yml'
  pull_request:
    paths:
      - 'projects/compartment-beta-gap/**'
      - '.github/workflows/compartment-beta-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/compartment-beta-gap/requirements.txt
      - run: python -m pip install -r projects/compartment-beta-gap/requirements.txt
      - name: Compare both normal and optimized read-only checkers
        shell: bash
        run: |
          set -euo pipefail
          for checker in verify verify_stages; do
            python -B "projects/compartment-beta-gap/${checker}.py" verify > "$RUNNER_TEMP/beta-${checker}-normal.json"
            python -B -O "projects/compartment-beta-gap/${checker}.py" verify > "$RUNNER_TEMP/beta-${checker}-optimized.json"
            diff -u "$RUNNER_TEMP/beta-${checker}-normal.json" "$RUNNER_TEMP/beta-${checker}-optimized.json"
          done
      - name: Check both external regenerations and unchanged archives
        shell: bash
        run: |
          set -euo pipefail
          for checker in verify verify_stages; do
            if [ "$checker" = verify ]; then
              archive=certificate.json
            else
              archive=stage-certificate.json
            fi
            output="$RUNNER_TEMP/beta-${checker}-regenerated.json"
            python -B "projects/compartment-beta-gap/${checker}.py" regenerate --output "$output"
            diff -u "projects/compartment-beta-gap/evidence/$archive" "$output"
            if python -B "projects/compartment-beta-gap/${checker}.py" regenerate --output "$output"; then
              exit 1
            fi
          done
          git diff --exit-code -- projects/compartment-beta-gap
          test -z "$(git status --porcelain --untracked-files=all -- projects/compartment-beta-gap)"
