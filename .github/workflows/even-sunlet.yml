name: Even sunlet exact checks
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/even-sunlet-dimension/**'
      - '.github/workflows/even-sunlet.yml'
  push:
    branches: [main]
    paths:
      - 'projects/even-sunlet-dimension/**'
      - '.github/workflows/even-sunlet.yml'
jobs:
  exact-audit:
    timeout-minutes: 15
    name: '${{ matrix.os }} / Python ${{ matrix.python }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/even-sunlet-dimension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Compare read-only normal and optimized checks
        shell: bash
        run: |
          set -eu
          python -B verify.py verify > "$RUNNER_TEMP/sunlet-primary.json"
          python -O -B verify.py verify > "$RUNNER_TEMP/sunlet-primary-O.json"
          cmp "$RUNNER_TEMP/sunlet-primary.json" "$RUNNER_TEMP/sunlet-primary-O.json"
          python -B verify_independent.py verify > "$RUNNER_TEMP/sunlet-independent.json"
          python -O -B verify_independent.py verify > "$RUNNER_TEMP/sunlet-independent-O.json"
          cmp "$RUNNER_TEMP/sunlet-independent.json" "$RUNNER_TEMP/sunlet-independent-O.json"
          python -B verify_elementary.py verify > "$RUNNER_TEMP/sunlet-elementary.json"
          python -O -B verify_elementary.py verify > "$RUNNER_TEMP/sunlet-elementary-O.json"
          cmp "$RUNNER_TEMP/sunlet-elementary.json" "$RUNNER_TEMP/sunlet-elementary-O.json"
          python -B verify_scalar.py verify > "$RUNNER_TEMP/sunlet-scalar.json"
          python -O -B verify_scalar.py verify > "$RUNNER_TEMP/sunlet-scalar-O.json"
          cmp "$RUNNER_TEMP/sunlet-scalar.json" "$RUNNER_TEMP/sunlet-scalar-O.json"
          python -B verify_elementary_independent.py verify > "$RUNNER_TEMP/sunlet-elementary-independent.json"
          python -O -B verify_elementary_independent.py verify > "$RUNNER_TEMP/sunlet-elementary-independent-O.json"
          cmp "$RUNNER_TEMP/sunlet-elementary-independent.json" "$RUNNER_TEMP/sunlet-elementary-independent-O.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
