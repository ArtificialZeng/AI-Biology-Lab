name: Verify serial-transfer global dynamics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/serial-transfer-global-dynamics/**', '.github/workflows/serial-transfer.yml']
  pull_request:
    paths: ['projects/serial-transfer-global-dynamics/**', '.github/workflows/serial-transfer.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/serial-transfer-global-dynamics/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/serial-transfer-global-dynamics
          python -B projects/serial-transfer-global-dynamics/verify.py verify > "$RUNNER_TEMP/serial-normal.json"
          python -B -O projects/serial-transfer-global-dynamics/verify.py verify > "$RUNNER_TEMP/serial-optimized.json"
          cmp "$RUNNER_TEMP/serial-normal.json" "$RUNNER_TEMP/serial-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
