name: Validated limiting oscillator

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/mixed-phosphorylation/validated-cycle/**'
      - '.github/workflows/validated-cycle.yml'

permissions:
  contents: read

jobs:
  interval-return-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify x86 Linux environment
        run: |
          test "$(uname -m)" = x86_64
          uname -srmo
          g++ --version
          cmake --version
      - name: Build pinned CAPD and check interval inequalities
        env:
          BUILD_JOBS: '4'
        shell: bash
        run: |
          set -euo pipefail
          bash projects/mixed-phosphorylation/validated-cycle/build_and_run.sh | tee "$RUNNER_TEMP/validated-cycle.log"
      - name: Check exact reduction and widened interval consequences
        run: |
          python projects/mixed-phosphorylation/validated-cycle/independent-audit/independent_check.py --log "$RUNNER_TEMP/validated-cycle.log" --output "$RUNNER_TEMP/independent-check.json"
      - name: Check first slow-manifold jet
        run: |
          python -m pip install -r requirements-exact.txt
          python projects/mixed-phosphorylation/validated-cycle/period-sensitivity/verify_first_jet.py --output "$RUNNER_TEMP/first-jet-audit.json"
      - name: Enclose nonzero period correction
        shell: bash
        run: |
          set -euo pipefail
          bash projects/mixed-phosphorylation/validated-cycle/period-sensitivity/build_and_run.sh | tee "$RUNNER_TEMP/period-sensitivity.log"

      - name: Save text verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-cycle-text-output
          path: |
            ${{ runner.temp }}/validated-cycle.log
            ${{ runner.temp }}/period-sensitivity.log
            ${{ runner.temp }}/first-jet-audit.json
            ${{ runner.temp }}/independent-check.json
          if-no-files-found: ignore
