name: Compartment fibers, sensors, and loopless repair

on:
  push:
    branches: [main]
    paths:
      - projects/cycle-global-fibers/**
      - projects/tree-two-leak-sensors/**
      - projects/cobra-loopless-auditor/**
      - scripts/verify_compartment_round_two.py
      - .github/workflows/research-round-two.yml
  pull_request:
    paths:
      - projects/cycle-global-fibers/**
      - projects/tree-two-leak-sensors/**
      - projects/cobra-loopless-auditor/**
      - scripts/verify_compartment_round_two.py
      - .github/workflows/research-round-two.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    name: Fibers and sensors (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r projects/tree-two-leak-sensors/requirements.txt
      - run: python scripts/verify_compartment_round_two.py
  loopless:
    name: Independent loopless regression (GLPK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: opencobra/cobrapy
          ref: a9c5ced29670bed5035fb19e87e7b0b588adb62d
          path: artifacts/cobrapy-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/cobra-loopless-auditor/requirements.txt
      - run: python projects/cobra-loopless-auditor/reproduce.py --checkout artifacts/cobrapy-source --output artifacts/loopless-receipt.json --logs artifacts/loopless-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopless-regression-evidence
          path: |
            artifacts/loopless-receipt.json
            artifacts/loopless-logs
