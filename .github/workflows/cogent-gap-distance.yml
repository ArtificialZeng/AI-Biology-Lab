name: Cogent3 gap-distance audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/cogent-gap-distance/**', '.github/workflows/cogent-gap-distance.yml']
  pull_request:
    paths: ['projects/cogent-gap-distance/**', '.github/workflows/cogent-gap-distance.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r projects/cogent-gap-distance/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        shell: bash
        run: |
          chmod -R a-w projects/cogent-gap-distance
          python -B projects/cogent-gap-distance/verify.py verify > "$RUNNER_TEMP/cogent-normal.txt"
          python -B -O projects/cogent-gap-distance/verify.py verify > "$RUNNER_TEMP/cogent-optimized.txt"
          cmp "$RUNNER_TEMP/cogent-normal.txt" "$RUNNER_TEMP/cogent-optimized.txt"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
