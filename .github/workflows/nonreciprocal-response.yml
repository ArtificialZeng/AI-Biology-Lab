name: Verify forward-response scope audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/nonreciprocal-response-audit/**', '.github/workflows/nonreciprocal-response.yml']
  pull_request:
    paths: ['projects/nonreciprocal-response-audit/**', '.github/workflows/nonreciprocal-response.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/nonreciprocal-response-audit/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/nonreciprocal-response-audit
          python -B projects/nonreciprocal-response-audit/verify.py verify > "$RUNNER_TEMP/response-normal.json"
          python -B -O projects/nonreciprocal-response-audit/verify.py verify > "$RUNNER_TEMP/response-optimized.json"
          cmp "$RUNNER_TEMP/response-normal.json" "$RUNNER_TEMP/response-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
