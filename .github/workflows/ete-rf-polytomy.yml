name: Verify ETE RF common-leaf correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/ete-rf-polytomy/**', '.github/workflows/ete-rf-polytomy.yml']
  pull_request:
    paths: ['projects/ete-rf-polytomy/**', '.github/workflows/ete-rf-polytomy.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/ete-rf-polytomy/requirements-native.txt
      - name: Read-only offline and actual native replay
        run: |
          chmod -R a-w projects/ete-rf-polytomy
          python -B projects/ete-rf-polytomy/verify.py verify > "$RUNNER_TEMP/ete-normal.json"
          python -B -O projects/ete-rf-polytomy/verify.py verify > "$RUNNER_TEMP/ete-optimized.json"
          cmp "$RUNNER_TEMP/ete-normal.json" "$RUNNER_TEMP/ete-optimized.json"
          ETE_NATIVE_OUT=$(python -c 'import os,pathlib; print(pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()/"ete-native")')
          python -B projects/ete-rf-polytomy/verify.py native --output-dir "$ETE_NATIVE_OUT"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
