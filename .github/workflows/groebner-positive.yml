name: Verify positive regular CRN counterfamily
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/groebner-positive-counterfamily/**', '.github/workflows/groebner-positive.yml']
  pull_request:
    paths: ['projects/groebner-positive-counterfamily/**', '.github/workflows/groebner-positive.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/groebner-positive-counterfamily/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/groebner-positive-counterfamily
          python -B projects/groebner-positive-counterfamily/verify.py verify > "$RUNNER_TEMP/groebner-normal.json"
          python -B -O projects/groebner-positive-counterfamily/verify.py verify > "$RUNNER_TEMP/groebner-optimized.json"
          cmp "$RUNNER_TEMP/groebner-normal.json" "$RUNNER_TEMP/groebner-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
