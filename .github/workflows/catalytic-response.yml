name: Verify catalytic response threshold
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['projects/catalytic-response/**', '.github/workflows/catalytic-response.yml']
  pull_request:
    paths: ['projects/catalytic-response/**', '.github/workflows/catalytic-response.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/catalytic-response/requirements.txt
      - name: Compare read-only normal and optimized wrappers
        run: |
          chmod -R a-w projects/catalytic-response
          python -B projects/catalytic-response/verify.py verify > "$RUNNER_TEMP/catalytic-normal.json"
          python -B -O projects/catalytic-response/verify.py verify > "$RUNNER_TEMP/catalytic-optimized.json"
          cmp "$RUNNER_TEMP/catalytic-normal.json" "$RUNNER_TEMP/catalytic-optimized.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
